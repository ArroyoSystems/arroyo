[package]
name = "arroyo"
version = "0.17.0-dev"
edition = "2024"

[features]
profiling = ["tikv-jemallocator/profiling"]
python = ["arroyo-udf-python/python-enabled"]
all-connectors = ["arroyo-connectors/all"]
# One feature per connector, so a build can include just the ones it needs.
# These must mirror the connector features of arroyo-connectors.
blackhole = ["arroyo-connectors/blackhole"]
confluent = ["arroyo-connectors/confluent"]
filesystem = ["arroyo-connectors/filesystem"]
fluvio = ["arroyo-connectors/fluvio"]
impulse = ["arroyo-connectors/impulse"]
kafka = ["arroyo-connectors/kafka"]
kinesis = ["arroyo-connectors/kinesis"]
mqtt = ["arroyo-connectors/mqtt"]
nats = ["arroyo-connectors/nats"]
nexmark = ["arroyo-connectors/nexmark"]
polling-http = ["arroyo-connectors/polling-http"]
preview = ["arroyo-connectors/preview"]
rabbitmq = ["arroyo-connectors/rabbitmq"]
redis = ["arroyo-connectors/redis"]
single-file = ["arroyo-connectors/single-file"]
sse = ["arroyo-connectors/sse"]
stdout = ["arroyo-connectors/stdout"]
webhook = ["arroyo-connectors/webhook"]
websocket = ["arroyo-connectors/websocket"]

[dependencies]
arroyo-types = { path ="../arroyo-types" }
arroyo-controller = { path = "../arroyo-controller" }
arroyo-api = { path = "../arroyo-api" }
arroyo-worker = { path = "../arroyo-worker" }
arroyo-server-common = { path = "../arroyo-server-common" }
arroyo-compiler-service = { path = "../arroyo-compiler-service" }
arroyo-node = { path = "../arroyo-node" }
arroyo-rpc = { path = "../arroyo-rpc" }
arroyo-openapi = { path ="../arroyo-openapi" }
arroyo-storage = { path = "../arroyo-storage" }
arroyo-udf-python = { path = "../arroyo-udf/arroyo-udf-python" }
arroyo-planner = { path = "../arroyo-planner" }
arroyo-connectors = { path = "../arroyo-connectors/arroyo-connectors" }

clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
cornucopia_async = { workspace = true }
rusqlite = {  workspace = true, features = ["backup"] }
uuid = { workspace = true }
refinery = { version = "0.8.14" , features = ["tokio-postgres", "rusqlite"] }
anyhow = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true}
clio = { version = "0.3.5", features = ["clap", "clap-parse"] }
async-trait = { workspace = true }
open = '5.3.0'
rustls = { workspace = true, features = ["aws_lc_rs"] }


[target.'cfg(all(not(target_env = "msvc"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { version = "0.6.0", features = ["unprefixed_malloc_on_supported_platforms"]}
