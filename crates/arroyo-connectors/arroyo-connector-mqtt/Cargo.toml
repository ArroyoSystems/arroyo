[package]
name = "arroyo-connector-mqtt"
version = "0.17.0-dev"
edition = "2024"

[lints.clippy]
to_string_trait_impl = "allow"

[dependencies]
arroyo-connector-common = { path = "../arroyo-connector-common" }
arroyo-types = { path = "../../arroyo-types" }
arroyo-rpc = { path = "../../arroyo-rpc" }
arroyo-formats = { path = "../../arroyo-formats" }
arroyo-operator = { path = "../../arroyo-operator" }
arroyo-state = { path = "../../arroyo-state" }
arrow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
typify = { workspace = true }
governor = "0.8.0"
anyhow = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
parquet = { workspace = true, features = ["async"] }
rumqttc = { version = "0.24.0", features = ["url"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-rustls = "0.25"
rustls = "0.22"

[dev-dependencies]
arroyo-connector-common = { path = "../arroyo-connector-common", features = ["test-utils"] }

[build-dependencies]
glob = "0.3"
