[package]
name = "arroyo-connector-filesystem"
version = "0.17.0-dev"
edition = "2024"

[lints.clippy]
to_string_trait_impl = "allow"

[dependencies]
arroyo-connector-common = { path = "../arroyo-connector-common" }
arroyo-types = { path = "../../arroyo-types" }
arroyo-storage = { path = "../../arroyo-storage" }
arroyo-rpc = { path = "../../arroyo-rpc" }
arroyo-formats = { path = "../../arroyo-formats" }
arroyo-operator = { path = "../../arroyo-operator" }
arroyo-state = { path = "../../arroyo-state" }
arrow = { workspace = true }
datafusion = { workspace = true }
datafusion-expr = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
prost = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
itertools = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
ulid = "1.2.1"
schemars = "1.0.4"
strum = { workspace = true }
strum_macros = { workspace = true }
sha2 = "0.10"
reqwest = { workspace = true, features = ["stream"] }
parquet = { workspace = true, features = ["async"] }
object_store = { workspace = true }
deltalake = { workspace = true, features = ["s3", "gcs"] }
delta_kernel = { workspace = true, features = ["arrow-58", "internal-api"] }
buoyant_kernel_derive = { workspace = true }
async-compression = { version = "0.4.3", features = ["tokio", "zstd", "gzip"] }
flate2 = { workspace = true }
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
iceberg-storage-opendal = { version = "0.10.1", default-features = false, features = ["opendal-fs", "opendal-s3"] }
typetag = "0.2"
apache-avro = {workspace = true}
num-bigint = "0.4.6"
rust_decimal = "1"
murmur3 = "0.5.2"

[dev-dependencies]
tempfile = "3"
