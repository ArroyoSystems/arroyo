[package]
name = "arroyo-connector-webhook"
version = "0.17.0-dev"
edition = "2024"

[lints.clippy]
to_string_trait_impl = "allow"

[dependencies]
arroyo-connector-common = { path = "../arroyo-connector-common" }
arroyo-types = { path = "../../arroyo-types" }
arroyo-rpc = { path = "../../arroyo-rpc" }
arroyo-formats = { path = "../../arroyo-formats" }
arroyo-operator = { path = "../../arroyo-operator" }
arroyo-state = { path = "../../arroyo-state" }
arrow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
typify = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }

[build-dependencies]
glob = "0.3"
